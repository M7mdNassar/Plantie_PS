name: plantie
description: "Smart Image Processing and Farmer Assistent"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_bottom_navigation_bar: ^1.3.3
  sqflite: ^2.4.1
  intl: ^0.20.2
  flutter_bloc: ^9.0.0
  dio: ^5.7.0
  hexcolor: ^3.0.1
  shared_preferences: ^2.3.5
  smooth_page_indicator: ^1.2.0+3
  lottie: ^3.3.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  uuid: ^4.4.2
  shimmer: ^3.0.0
  readmore: ^3.0.0
  onnxruntime: ^1.4.1
  image: ^4.5.2
  path_provider: ^2.1.5
  path: ^1.8.3
  geolocator: ^13.0.2
  url_launcher: ^6.3.0
  fl_chart: ^0.70.2
  geocoding: ^3.0.0
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.0.0
  flutter_markdown: ^0.7.0
  google_mobile_ads: ^4.0.0

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app/plantie.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.dev
    - .env.prod
    - models/plant_nonPlant_model/plant_classifier.onnx
    - models/plant_nonPlant_model/labels.txt
    - models/disease_classification_model/plant_disease_classifier_merged.onnx
    - models/disease_classification_model/class_labels.json
    - assets/images/
    - assets/images/onBoardingImages/
    - assets/lottie/
    - assets/
    - assets/plants_data.json
    - assets/plant_stores.json

  fonts:
    - family: jannah
      fonts:
        - asset: assets/fonts/jannah.ttf
          weight: 700
    - family: IconBroken
      fonts:
        - asset: assets/fonts/icons.ttf
flutter_intl:
  enabled: true